name: 갤러리 자동 갱신

# 표지 현황(ahnboat_lab_cover_status)이 바뀌면 그 뒤에 갤러리를 다시 만든다.
# - 한 시간마다 원본의 최신 커밋을 확인해, 지난번에 만든 뒤로 바뀌었을 때만 실제로 만든다.
# - 원본의 수집이 끝날 때 바로 부르는 신호(workflow_dispatch)도 받는다.
on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "원본이 안 바뀌어도 다시 만들기"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: gallery-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 원본(표지 현황)의 최신 커밋 확인
        id: src
        run: echo "sha=$(git ls-remote https://github.com/adminmrobo/ahnboat_lab_cover_status.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: 이 원본으로 이미 만들었는지 확인
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .gallery_src
          key: gallery-src-${{ steps.src.outputs.sha }}
          lookup-only: true

      - name: 만들 필요 판단
        id: go
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then
            echo "원본이 그대로라 건너뜀"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.go.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: 새 저장소를 목록에 더하고 갤러리 데이터 다시 만들기
        if: steps.go.outputs.run == 'true'
        env:
          SRC_SHA: ${{ steps.src.outputs.sha }}
        run: |
          python scripts/sync_repos.py
          sh scripts/collect.sh "$RUNNER_TEMP/_gallery_work"

      - name: 바뀐 것이 있으면 커밋
        if: steps.go.outputs.run == 'true'
        run: |
          git config user.name "adminmrobo"
          git config user.email "sangsun.ahn@gmail.com"
          git add data scripts/repos.txt
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "갤러리 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull -q --rebase origin main || exit 1
            sleep $((i * 5))
          done
          exit 1

      - name: 이 원본으로 만들었다고 기록
        if: steps.go.outputs.run == 'true'
        run: mkdir -p .gallery_src && echo "${{ steps.src.outputs.sha }}" > .gallery_src/sha

      - uses: actions/cache/save@v4
        if: steps.go.outputs.run == 'true'
        with:
          path: .gallery_src
          key: gallery-src-${{ steps.src.outputs.sha }}
